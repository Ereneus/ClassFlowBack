spring.application.name=ms-message
server.port=8084

spring.datasource.url=jdbc:h2:mem:mensajeria_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

sentry.dsn=${SENTRY_DSN:}
sentry.environment=local
sentry.exception-resolver-order=-2147483648

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

spring.rabbitmq.addresses=${RABBITMQ_URL:}

# Topologia RabbitMQ centralizada (RabbitMqProperties). Debe coincidir con ms-notification.
classflow.rabbitmq.events-exchange=classflow.events
classflow.rabbitmq.message-created-queue=classflow.messages.created
classflow.rabbitmq.message-created-routing-key=message.created
classflow.rabbitmq.dead-letter-exchange=classflow.dlx
classflow.rabbitmq.dead-letter-queue=classflow.messages.dlq
# Evita que un broker caido bloquee el envio de mensajes durante el timeout por defecto (60s).
spring.rabbitmq.connection-timeout=5s