spring:
  application:
    name: ms-academic
  datasource:
    url: jdbc:h2:mem:academic_db
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    defer-datasource-initialization: false
  flyway:
    locations: classpath:db/migration
    enabled: true
    baseline-on-migrate: false
    out-of-order: false
  # Productor Kafka. Comun a local y Docker: en Docker KAFKA_BOOTSTRAP_SERVERS apunta a la red
  # interna (kafka-N:29092); en local a los listeners EXTERNAL de ClassFlowKafka (localhost:9092-9094).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: ms-academic
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # El serializer del valor (JSON con el ObjectMapper de Spring) lo fija KafkaProducerConfig.
      acks: all                     # espera a las min.insync.replicas (2 de 3) antes de confirmar
      compression-type: lz4
      batch-size: 32768
      properties:
        enable.idempotence: true    # sin duplicados por reintentos del productor
        max.in.flight.requests.per.connection: 5
        linger.ms: 10               # agrupa envios cercanos en un mismo batch
        delivery.timeout.ms: 30000  # tiempo total para entregar (incluye reintentos)
        request.timeout.ms: 10000
        max.block.ms: 5000          # sin cluster, la peticion HTTP no queda bloqueada 60 s

classflow:
  kafka:
    topics:
      grades: classflow.academic.grades

server:
  port: 8082

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: local
  exception-resolver-order: -2147483648