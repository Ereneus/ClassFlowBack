spring.application.name=ms-assistance
server.port=8083

spring.datasource.url=jdbc:h2:mem:asistencia_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

sentry.dsn=${SENTRY_DSN:}
sentry.environment=local
sentry.exception-resolver-order=-2147483648

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# --- Productor Kafka ---
# Comun a local y Docker: en Docker KAFKA_BOOTSTRAP_SERVERS apunta a la red interna
# (kafka-N:29092); en local a los listeners EXTERNAL del docker-compose.kafka.yml.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=ms-assistance
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# El serializer del valor (JSON con el ObjectMapper de Spring) lo fija KafkaProducerConfig.
# acks=all: el broker confirma cuando el mensaje esta en las min.insync.replicas (2 de 3).
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.batch-size=32768
# Idempotencia: los reintentos del productor no generan duplicados ni desorden.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
# Sin cluster disponible, la peticion HTTP no queda bloqueada los 60 s por defecto.
spring.kafka.producer.properties.max.block.ms=5000

classflow.kafka.topics.attendance=classflow.assistance.attendance
