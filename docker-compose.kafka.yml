# =============================================================================
# Plataforma de streaming Kafka de ClassFlow
#
#   zookeeper-1..3 ensemble de 3 nodos: guarda los metadatos del cluster y elige el
#                  controller. Con 3 nodos el quorum es 2, asi que tolera la caida de 1.
#   kafka-1..3     3 brokers -> permite replication-factor 3 y min.insync.replicas 2
#   kafka-init     contenedor de un solo uso que crea/ajusta los topicos (kafka/create-topics.sh)
#   kafka-ui       consola web para administrar brokers, topicos y consumer groups
#
# Se puede levantar solo:
#   docker compose -f docker-compose.kafka.yml up -d
# o junto al resto del backend (docker-compose.yml lo incluye con `include:`):
#   docker compose up -d
#
# Listeners de cada broker:
#   INTERNAL  kafka-N:29092         trafico entre brokers y desde los microservicios (red Docker)
#   EXTERNAL  ${KAFKA_EXTERNAL_HOST}:909N  acceso desde el host (IDE, pruebas locales)
# =============================================================================

x-kafka-broker: &kafka-broker
  image: confluentinc/cp-kafka:7.7.1
  restart: unless-stopped
  depends_on:
    zookeeper-1:
      condition: service_healthy
    zookeeper-2:
      condition: service_healthy
    zookeeper-3:
      condition: service_healthy
  networks:
    - classflow-back-net

x-zookeeper-node: &zookeeper-node
  image: confluentinc/cp-zookeeper:7.7.1
  restart: unless-stopped
  # Sano solo cuando el nodo forma parte del quorum (leader o follower), no con solo arrancar.
  healthcheck:
    test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -qE 'Mode: (leader|follower)'"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 15s
  networks:
    - classflow-back-net

x-zookeeper-common-env: &zookeeper-common-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  # Ticks que un follower tiene para conectarse y sincronizarse con el leader (init)
  # y para seguir sincronizado (sync).
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # Miembros del ensemble: host:puerto_seguidores:puerto_eleccion_de_leader.
  ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
  KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=srvr,ruok,mntr"
  KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

x-kafka-common-env: &kafka-common-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Topicos internos (__consumer_offsets, __transaction_state) replicados en los 3 brokers.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Valores por defecto para topicos nuevos: 3 particiones, 3 replicas, 2 replicas en sincronia
  # como minimo para aceptar escrituras con acks=all (tolera la caida de 1 broker).
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # Los topicos se crean de forma explicita (kafka-init / ms-kafka-admin), nunca por accidente.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  zookeeper-1:
    <<: *zookeeper-node
    hostname: zookeeper-1
    environment:
      <<: *zookeeper-common-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper-1-data:/var/lib/zookeeper/data
      - zookeeper-1-log:/var/lib/zookeeper/log

  zookeeper-2:
    <<: *zookeeper-node
    hostname: zookeeper-2
    environment:
      <<: *zookeeper-common-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper-2-data:/var/lib/zookeeper/data
      - zookeeper-2-log:/var/lib/zookeeper/log

  zookeeper-3:
    <<: *zookeeper-node
    hostname: zookeeper-3
    environment:
      <<: *zookeeper-common-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper-3-data:/var/lib/zookeeper/data
      - zookeeper-3-log:/var/lib/zookeeper/log

  kafka-1:
    <<: *kafka-broker
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_BROKER_ID: 1
      KAFKA_BROKER_RACK: rack-1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-1:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-2:
    <<: *kafka-broker
    hostname: kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-common-env
      KAFKA_BROKER_ID: 2
      KAFKA_BROKER_RACK: rack-2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-2:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-3:
    <<: *kafka-broker
    hostname: kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_BROKER_ID: 3
      KAFKA_BROKER_RACK: rack-3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-3:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Crea los topicos de negocio y sus DLT con particiones, replicas, retencion y cleanup policy.
  # Es idempotente: si el topico existe, solo vuelve a aplicar la configuracion.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    restart: "no"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    networks:
      - classflow-back-net

  # Consola web: http://<host>:8090 (usuario/clave KAFKA_UI_USER / KAFKA_UI_PASSWORD).
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: classflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      # Permite editar la configuracion de clusters desde la propia UI.
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?Definir KAFKA_UI_PASSWORD en backend/.env}
    networks:
      - classflow-back-net

networks:
  classflow-back-net:
    name: classflow-back-net
    driver: bridge

volumes:
  zookeeper-1-data:
  zookeeper-1-log:
  zookeeper-2-data:
  zookeeper-2-log:
  zookeeper-3-data:
  zookeeper-3-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
