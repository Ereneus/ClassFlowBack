# La plataforma Kafka (Zookeeper, 3 brokers, kafka-init y kafka-ui) y el cluster RabbitMQ
# (2 nodos) viven en sus propios archivos para poder levantarlos solos; se incluyen aqui
# para que `docker compose up` arranque todo junto.
# La red classflow-back-net se define en docker-compose.kafka.yml.
include:
  - docker-compose.kafka.yml
  - docker-compose.rabbitmq.yml

# Los clientes AMQP conocen los 2 nodos y se conectan a uno al azar; si ese nodo cae,
# Spring reconecta al siguiente de la lista.
x-rabbitmq-addresses: &rabbitmq-addresses >-
  amqp://${RABBITMQ_USER:-classflow}:${RABBITMQ_PASSWORD}@rabbitmq-1:5672,amqp://${RABBITMQ_USER:-classflow}:${RABBITMQ_PASSWORD}@rabbitmq-2:5672

x-rabbitmq-depends-on: &rabbitmq-depends-on
  rabbitmq-1:
    condition: service_healthy
  rabbitmq-2:
    condition: service_healthy

x-kafka-client-env: &kafka-client-env
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092

services:
  auth-db:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classflow-back-net

  academic-db:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: academic_user
      POSTGRES_PASSWORD: academic_pass
    volumes:
      - academic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic_user -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classflow-back-net

  assistance-db:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: assistance_db
      POSTGRES_USER: assistance_user
      POSTGRES_PASSWORD: assistance_pass
    volumes:
      - assistance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistance_user -d assistance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classflow-back-net

  message-db:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: message_db
      POSTGRES_USER: message_user
      POSTGRES_PASSWORD: message_pass
    volumes:
      - message-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U message_user -d message_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classflow-back-net

  notification-db:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classflow-back-net

  glitchtip-db:
    restart: unless-stopped
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classflow-back-net

  glitchtip-valkey:
    restart: unless-stopped
    image: valkey/valkey:9
    networks:
      - classflow-back-net

  # Error tracking self-hospedado (compatible con el SDK de Sentry). UI en http://localhost:8000.
  # La primera vez, crear una cuenta/organizacion/proyecto ahi y copiar el DSN a SENTRY_DSN en .env.
  glitchtip:
    restart: unless-stopped
    image: glitchtip/glitchtip:6
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@glitchtip-db:5432/postgres
      VALKEY_URL: redis://glitchtip-valkey:6379
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:?Definir GLITCHTIP_SECRET_KEY en backend/.env (openssl rand -hex 32)}"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      DEFAULT_FROM_EMAIL: glitchtip@classflow.cl
      ENABLE_ADMIN: "True"
      SERVER_ROLE: all_in_one
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - classflow-back-net

  api-gateway:
    restart: unless-stopped
    build: ./api-gateway
    image: api-gateway:local
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${GATEWAY_SPRING_PROFILES_ACTIVE:-docker,entra}
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI:?Definir ENTRA_ISSUER_URI en backend/.env}
      - ENTRA_API_AUDIENCE=${ENTRA_API_AUDIENCE:?Definir ENTRA_API_AUDIENCE en backend/.env}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - bff
      - ms-auth
      - ms-academic
      - ms-assistance
      - ms-message
      - ms-notification
      - ms-analytics
      - ms-kafka-admin
    networks:
      - classflow-back-net

  bff:
    restart: unless-stopped
    build: ./bff
    image: bff:local
    environment:
      - SPRING_PROFILES_ACTIVE=${BFF_SPRING_PROFILES_ACTIVE:-docker,entra}
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI:?Definir ENTRA_ISSUER_URI en backend/.env}
      - ENTRA_API_AUDIENCE=${ENTRA_API_AUDIENCE:?Definir ENTRA_API_AUDIENCE en backend/.env}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - ms-auth
      - ms-academic
      - ms-assistance
      - ms-message
      - ms-notification
    networks:
      - classflow-back-net

  ms-auth:
    restart: unless-stopped
    build: ./ms-auth
    image: ms-auth:local
    environment:
      - SPRING_PROFILES_ACTIVE=${MS_AUTH_SPRING_PROFILES_ACTIVE:-docker,entra}
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI:?Definir ENTRA_ISSUER_URI en backend/.env}
      - ENTRA_API_AUDIENCE=${ENTRA_API_AUDIENCE:?Definir ENTRA_API_AUDIENCE en backend/.env}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - JWT_SECRET=${JWT_SECRET:?Definir JWT_SECRET en backend/.env (openssl rand -hex 32)}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Definir INTERNAL_API_KEY en backend/.env (openssl rand -hex 32)}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - classflow-back-net

  ms-academic:
    restart: unless-stopped
    build: ./ms-academic
    image: ms-academic:local
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      academic-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - classflow-back-net

  ms-assistance:
    restart: unless-stopped
    build: ./ms-assistance
    image: ms-assistance:local
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      assistance-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - classflow-back-net

  ms-message:
    restart: unless-stopped
    build: ./ms-message
    image: ms-message:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SENTRY_DSN: ${SENTRY_DSN:-}
      RABBITMQ_URL: *rabbitmq-addresses
    depends_on:
      <<: *rabbitmq-depends-on
      message-db:
        condition: service_healthy
    networks:
      - classflow-back-net

  ms-notification:
    restart: unless-stopped
    build: ./ms-notification
    image: ms-notification:local
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      SENTRY_DSN: ${SENTRY_DSN:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Definir INTERNAL_API_KEY en backend/.env (openssl rand -hex 32)}
      RABBITMQ_URL: *rabbitmq-addresses
    depends_on:
      <<: *rabbitmq-depends-on
      notification-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - classflow-back-net

  # Consumidor analitico de los eventos Kafka (consumer group propio, estado en memoria
  # reconstruible desde los topicos). Sin base de datos.
  ms-analytics:
    restart: unless-stopped
    build: ./ms-analytics
    image: ms-analytics:local
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - classflow-back-net

  # Administrador de Kafka: topicos, configuraciones, particiones y consumer groups.
  ms-kafka-admin:
    restart: unless-stopped
    build: ./ms-kafka-admin
    image: ms-kafka-admin:local
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - classflow-back-net

volumes:
  auth-postgres-data:
  academic-postgres-data:
  assistance-postgres-data:
  message-postgres-data:
  notification-postgres-data:
  glitchtip-postgres-data:
  glitchtip-uploads: