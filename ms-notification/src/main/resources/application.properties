server.port=8085
spring.application.name=ms-notification

# H2 Database
spring.datasource.url=jdbc:h2:mem:notificaciones_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# Email Configuration (para desarrollo - usar fake SMTP o configurar real)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_email@gmail.com
spring.mail.password=tu_contraseña
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Direccion "From" mostrada al destinatario. Debe ser un remitente verificado
# en el proveedor SMTP (con Brevo, por ejemplo, no puede ser el login SMTP).
app.mail.from=${MAIL_FROM:tu_email@gmail.com}

sentry.dsn=${SENTRY_DSN:}
sentry.environment=local
sentry.exception-resolver-order=-2147483648

# Logging
logging.level.notificaciones_service=DEBUG

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

spring.rabbitmq.addresses=${RABBITMQ_URL:}
# RABBITMQ_URL puede traer varios nodos separados por coma (cluster); se elige uno al azar
# por conexion y, si cae, Spring reconecta al siguiente.
spring.rabbitmq.address-shuffle-mode=random
# Confirmacion manual: RabbitNotificationListener hace basicAck/basicNack de forma explicita.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
# Un mensaje rechazado por el contenedor (p. ej. JSON invalido) va a la DLQ en vez de reencolarse.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Topologia RabbitMQ centralizada (RabbitMqProperties). Debe coincidir con ms-message.
classflow.rabbitmq.events-exchange=classflow.events
classflow.rabbitmq.message-created-queue=classflow.messages.created
classflow.rabbitmq.message-created-routing-key=message.created
classflow.rabbitmq.dead-letter-exchange=classflow.dlx
classflow.rabbitmq.dead-letter-queue=classflow.messages.dlq
# Clave compartida solo con ms-auth para la llamada interna POST /api/notifications/email
# (correo de recuperacion de contrasena, sin usuario logueado del que reenviar un JWT).
internal.api.key=${INTERNAL_API_KEY}

# =============================================================================
# Kafka: consumidor de classflow.academic.grades y classflow.assistance.attendance
# (complementa a RabbitMQ, no lo reemplaza: los mensajes internos siguen por RabbitMQ).
# Comun a local y Docker: en Docker KAFKA_BOOTSTRAP_SERVERS apunta a kafka-N:29092.
# =============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=ms-notification

# Consumer group propio: recibe TODOS los eventos aunque ms-analytics tambien los consuma
# (otro group). Las instancias de ms-notification se reparten las particiones entre si.
spring.kafka.consumer.group-id=classflow-notification
# Un grupo nuevo empieza desde el principio del topico (no pierde eventos previos).
spring.kafka.consumer.auto-offset-reset=earliest
# El offset lo confirma el contenedor despues de procesar cada mensaje (ack-mode=record).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# El deserializer del valor (JSON tipado + ErrorHandlingDeserializer) lo define KafkaConsumerConfig.
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.consumer.max-poll-records=50
# Rebalanceo cooperativo: al entrar/salir una instancia solo se mueven las particiones necesarias.
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.consumer.properties.max.poll.interval.ms=300000

# 3 hilos consumidores por topico = 1 por particion.
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=record
# Si un topico aun no existe, el consumidor espera en vez de impedir el arranque del servicio.
spring.kafka.listener.missing-topics-fatal=false

# Productor usado solo para publicar en los DLT (<topico>.DLT).
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.max.block.ms=5000

classflow.kafka.topics.grades=classflow.academic.grades
classflow.kafka.topics.attendance=classflow.assistance.attendance
# Los mensajes fallidos van a <topico>.DLT (creados por kafka/create-topics.sh).
classflow.kafka.dlt-suffix=.DLT
# Reintentos antes de enviar al DLT: 3 reintentos con backoff 1 s, 2 s, 4 s (tope 10 s).
classflow.kafka.retry.max-attempts=3
classflow.kafka.retry.initial-interval-ms=1000
classflow.kafka.retry.multiplier=2.0
classflow.kafka.retry.max-interval-ms=10000