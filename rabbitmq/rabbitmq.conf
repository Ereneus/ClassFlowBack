# Configuracion compartida por los 3 nodos del cluster RabbitMQ (docker-compose.rabbitmq.yml).

# Formacion del cluster: cada nodo conoce la lista fija de pares y se une al primero
# que encuentre. rabbitmq-2 y rabbitmq-3 arrancan despues de que rabbitmq-1 este sano.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Si se cae un nodo, los otros dos siguen; si quedan en minoria tras una particion
# de red, se pausan en vez de divergir.
cluster_partition_handling = pause_minority
