# Configuracion compartida por los 2 nodos del cluster RabbitMQ (docker-compose.rabbitmq.yml).

# Formacion del cluster: cada nodo conoce la lista fija de pares y se une al primero
# que encuentre. rabbitmq-2 arranca despues de que rabbitmq-1 este sano.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Con 2 nodos no hay mayoria posible tras una particion de red (pause_minority pausaria
# ambos). autoheal deja seguir a los dos y, al reconectarse, reinicia el lado perdedor
# para que el cluster vuelva a un unico estado.
cluster_partition_handling = autoheal
